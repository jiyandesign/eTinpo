<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link href="image/favicon.ico" rel="shortcut icon">
  <title>eTINPO-應用類別</title>
</head>

<body class="application-page application-page--zh">
  <!-- header.js -->
  <script charset="utf-8" src="js/header.js"></script>

  <section class="application">
    <div class="applicationBanner" data-parallax="application-mask" data-parallax-mode="from-top"
      data-parallax-desktop="120" data-parallax-mobile="46" data-parallax-speed="0.22">
      <div class="applicationBanner_parallaxMask">
        <img src="image/application/banner.jpg" alt="應用類別" class="col-12 applicationBanner_bg" data-parallax-layer>
      </div>
      <img src="image/application/clothes.png" alt="應用類別" class="img-fluid applicationBanner_clothes etinpo-float float-application-clothes">
      <div class="applicationBanner_text">
        <img src="image/application/title-01.svg" alt="" class="application_text01">
        <img src="image/application/title-02.svg" alt="" class="application_text02" data-aos="fade-up" data-aos-duration="3000">
      </div>
    </div>
    <div class="techItem">

      <div class="container">
        <div class="d-flex flex-column flex-md-row align-items-center application-item application-item--apparel">
          <div class="techPhoto">
            <div class="techPhoto01">
            <img src="image/application/apparel.png" alt="服裝" class="etinpo-float float-application-apparel"></div>
            <img src="image/application/product_text_01.svg" alt="服裝文字" width="238" class="techPhoto02">
          </div>

          <div class="techItemText">
            <p>極端天氣下的絕對防護，日常生活的貼身存在，經得起考驗的安全舒適。<br>
              更輕、更透氣、更安全的戶外夥伴！</p>
          </div>
        </div>
        <div class="d-flex flex-column flex-md-row align-items-center justify-content-end application-item application-item--footwear">
          <div class="techPhoto">
            <div class="techPhoto01">
            <img src="image/application/footwear.png" alt="鞋類" class="etinpo-float float-application-footwear"></div>
            <img src="image/application/product_text_02.svg" alt="鞋類文字" width="304" class="techPhoto02">
          </div>
          <div class="techItemText">
            <p>超強防水，長效表現，為喜愛戶外的你打造。<br>
              登山越野不用擔心，勇往直前。</p>
          </div>
        </div>
        <div class="d-flex flex-column flex-md-row align-items-center justify-content-end application-item application-item--gloves">
          <div class="techPhoto">            
            <div class="techPhoto01">
            <img src="image/application/gloves.png" alt="手套" class="etinpo-float float-application-gloves"></div>
            <img src="image/application/product_text_03.svg" alt="手套文字" width="210" class="techPhoto02">
          </div>
          <div class="techItemText">
            <p>阻絕寒冷與水氣，絕佳防護。<br>
              硬派科技，雙手掌握。</p>
          </div>
        </div>
        <div class="d-flex flex-column flex-md-row align-items-center application-item application-item--medical">
          <div class="techPhoto">            
            <div class="techPhoto01">
            <img src="image/application/medical.png" alt="醫療用防護衣" class="etinpo-float float-application-medical"></div>
            <img src="image/application/product_text_04.svg" alt="醫療用防護衣文字" width="335" class="techPhoto02">
          </div>
          <div class="techItemText">
            <p>專業測試，三重防護，專為醫護打造。<br>
              有效抵禦外部污染源，優異的透氣性與輕便性減少長期穿戴的不適感。</p>
          </div>
        </div>

      </div>

    </div>
  </section>
  <!-- footer.js -->
  <script charset="utf-8" src="js/footer.js"></script>
  <script src="js/parallax.js"></script>

</body>

</html>
