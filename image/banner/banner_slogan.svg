<?xml version="1.0" encoding="UTF-8"?>
<svg id="_圖層_2" data-name="圖層 2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 244 478">
  <defs>
    <style>
      .cls-1 {
        fill: none;
      }

      .cls-2 {
        fill: #fff;
      }

      .cls-3 {
        fill: #ffc200;
      }

      /* Each vertical column enters once as a complete line.  Movement stays
         horizontal and the final frame remains visible after the entrance. */
      #text > g > g > g:first-child > path:nth-child(-n+5) {
        animation: slogan-line-one 2.6s cubic-bezier(.22, .75, .24, 1) 0s both;
      }

      #text > g > g > g:first-child > path:nth-child(n+6):nth-child(-n+10) {
        animation: slogan-line-two 2.6s cubic-bezier(.22, .75, .24, 1) .18s both;
      }

      #text > g > g > g:first-child > path:nth-child(n+11) {
        animation: slogan-line-three 2.6s cubic-bezier(.22, .75, .24, 1) .36s both;
      }

      #text > g > g > g:last-child > path {
        animation: slogan-line-four 2.6s cubic-bezier(.22, .75, .24, 1) .54s both;
      }

      #text path {
        transform-box: view-box;
        transform-origin: center;
        will-change: transform, opacity;
      }

      @keyframes slogan-line-one {
        0% { opacity: 0; transform: translateX(-28px); }
        100% { opacity: 1; transform: translateX(0); }
      }

      @keyframes slogan-line-two {
        0% { opacity: 0; transform: translateX(28px); }
        100% { opacity: 1; transform: translateX(0); }
      }

      @keyframes slogan-line-three {
        0% { opacity: 0; transform: translateX(-28px); }
        100% { opacity: 1; transform: translateX(0); }
      }

      @keyframes slogan-line-four {
        0% { opacity: 0; transform: translateX(28px); }
        100% { opacity: 1; transform: translateX(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        #text path {
          animation: none !important;
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </defs>
